<ActionBar title="Bluetooth"></ActionBar>

<GridLayout rows="*">

    <RadListView row="0" [items]="devices" *ngIf="devices"
        pullToRefresh="true" (pullToRefreshInitiated)="onPullToRefreshInitiated($event)">
        <ng-template tkListItemTemplate let-item="item">
            <Ripple rippleColour="#f2f2f2" (tap)="connect(item.UUID)">
                <Label [text]="item.name + ' (' + item.UUID + ')'" class="p-15"></Label>
            </Ripple>
        </ng-template>
    </RadListView>

    <ActivityIndicator row="1" [busy]="isScanning"
        horizonalAlignment="center" verticalAlignment="center"></ActivityIndicator>

</GridLayout>
